<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profit Calculator</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f0f4f8;
  margin: 0;
  padding: 20px;
}
.container {
  max-width: 450px;
  margin: 20px auto;
  background: white;
  padding: 22px;
  border-radius: 16px;
  box-shadow: 0 4px 15px #cccccc;
}
h1 {
  text-align: center;
  color: #087f5b;
}
p {
  text-align: center;
  color: #555;
}
label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}
input {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  margin-top: 7px;
  border: 1px solid #bbb;
  border-radius: 8px;
  font-size: 17px;
}
button {
  width: 100%;
  padding: 14px;
  margin-top: 20px;
  background: #087f5b;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 17px;
}
#result {
  margin-top: 20px;
  padding: 15px;
  background: #e6fcf5;
  border-radius: 8px;
  font-weight: bold;
  line-height: 1.8;
}
</style>
</head>
<body>
<div class="container">
<h1>Profit Calculator</h1>
<p>Calculate Profit, Loss and Profit Percentage</p>

<label>Buying Price (Rs.)</label>
<input type="number" id="buy" placeholder="Enter buying price">

<label>Selling Price (Rs.)</label>
<input type="number" id="sell" placeholder="Enter selling price">

<button onclick="calculate()">Calculate Now</button>

<div id="result">Your result will appear here.</div>
</div>

<script>
function calculate() {
  let buy = Number(document.getElementById("buy").value);
  let sell = Number(document.getElementById("sell").value);
  let result = document.getElementById("result");

  if (document.getElementById("buy").value === "" ||
      document.getElementById("sell").value === "" ||
      buy <= 0 || sell < 0) {
    result.innerHTML = "Please enter valid prices.";
    return;
  }

  let difference = sell - buy;
  let percentage = (difference / buy) * 100;

  if (difference > 0) {
    result.innerHTML = "Profit: Rs. " + difference.toFixed(2) +
      "<br>Profit Percentage: " + percentage.toFixed(2) + "%";
  } else if (difference < 0) {
    result.innerHTML = "Loss: Rs. " + Math.abs(difference).toFixed(2) +
      "<br>Loss Percentage: " + Math.abs(percentage).toFixed(2) + "%";
  } else {
    result.innerHTML = "No Profit, No Loss.";
  }
}
</script>
</body>
  </html>
